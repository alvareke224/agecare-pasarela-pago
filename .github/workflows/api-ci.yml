name: API · tests y DDL

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: agecare-admin-api

jobs:
  tests:
    name: pytest (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agecare-admin-api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  ddl:
    name: DDL + pruebas SQL (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agecare_admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: agecare_admin
    steps:
      - uses: actions/checkout@v4
      - name: Modelo base + facturación
        run: |
          psql -q -f db/agecare_admin_ddl.sql
          psql -q -f db/agecare_billing_ddl.sql
          psql -q -f db/agecare_billing_ddl.sql   # idempotencia
      - name: Pruebas SQL
        run: |
          psql -f db/agecare_admin_ddl_tests.sql   | tee base.log
          psql -f db/agecare_billing_ddl_tests.sql | tee billing.log
          grep -q "TODAS LAS PRUEBAS PASARON" base.log
          grep -q "TODAS LAS PRUEBAS DE FACTURACIÓN PASARON" billing.log
