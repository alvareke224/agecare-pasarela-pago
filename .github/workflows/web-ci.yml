name: Web · typecheck y build

# El despliegue lo hace Vercel automáticamente al hacer push (ver docs/DEPLOY_VERCEL.md en la API).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agecare-admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agecare-admin-web/package-lock.json
      - run: npm ci
      - run: npm run build
